<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service unavailable</title>
  <meta name="error-code" content="__ERROR_CODE__">
  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#111b33;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#fb7185;
      --border:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(251,113,133,.16), transparent 60%),
        radial-gradient(900px 500px at 90% 20%, rgba(96,165,250,.12), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      padding:24px;
    }
    .card{
      width:min(820px,100%);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid var(--border);
      border-radius:16px;
      padding:28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .pill{
      display:inline-flex;
      gap:.5rem;
      align-items:center;
      padding:.35rem .7rem;
      border-radius:999px;
      border:1px solid var(--border);
      color:var(--muted);
      font-size:.9rem;
      letter-spacing:.02em;
    }
    h1{ margin:14px 0 6px; font-size:2rem; line-height:1.2; }
    p{ margin:0 0 18px; color:var(--muted); line-height:1.6; }
    .actions{ display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }
    a.btn{
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      padding:.65rem .95rem;
      border-radius:12px;
      text-decoration:none;
      border:1px solid var(--border);
      color:var(--text);
      background:rgba(15,23,42,.65);
    }
    a.btn.primary{
      background:linear-gradient(180deg, rgba(251,113,133,.28), rgba(251,113,133,.12));
      border-color:rgba(251,113,133,.35);
    }
    .details{
      margin-top:16px;
      border-top:1px solid var(--border);
      padding-top:14px;
      color:var(--muted);
      font-size:.95rem;
      display:grid;
      gap:8px;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .k{ min-width:140px; color:#cbd5e1; }
    code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      background:rgba(0,0,0,.25);
      padding:.15rem .35rem;
      border-radius:8px;
      border:1px solid var(--border);
      word-break:break-all;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="pill"><span id="pill-code">__ERROR_CODE__</span> • Server error</div>
    <h1>We’re having trouble right now</h1>
    <p>Something went wrong on our side. Please try again in a few minutes.</p>

    <div class="actions">
      <a class="btn primary" href="/">Go to homepage</a>
      <a class="btn" href="javascript:location.reload()">Try again</a>
    </div>

    <div class="details">
      <div class="row"><div class="k">URL</div><div><code id="url"></code></div></div>
      <div class="row"><div class="k">Time (client)</div><div><code id="time"></code></div></div>
      <div class="row"><div class="k">Status</div><div><code id="status">__ERROR_CODE__</code></div></div>
    </div>
  </main>

  <script>
    document.getElementById('url').textContent = location.href;
    document.getElementById('time').textContent = new Date().toISOString();

    var meta = document.querySelector('meta[name="error-code"]');
    var code = (meta && meta.content) ? meta.content : '50x';
    document.getElementById('status').textContent = code;
    document.getElementById('pill-code').textContent = code;
  </script>
</body>
</html>
