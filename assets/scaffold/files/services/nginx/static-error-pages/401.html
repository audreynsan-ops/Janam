<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>401 — Unauthorized</title>
  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#111b33;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#fb7185;
      --border:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(251,113,133,.16), transparent 60%),
        radial-gradient(900px 500px at 90% 20%, rgba(96,165,250,.12), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      padding:24px;
    }
    .card{
      width:min(720px,100%);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid var(--border);
      border-radius:16px;
      padding:28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .pill{
      display:inline-flex;
      gap:.5rem;
      align-items:center;
      padding:.35rem .7rem;
      border-radius:999px;
      border:1px solid var(--border);
      color:var(--muted);
      font-size:.9rem;
      letter-spacing:.02em;
    }
    h1{ margin:14px 0 6px; font-size:2rem; line-height:1.2; }
    p{ margin:0 0 18px; color:var(--muted); line-height:1.6; }
    .actions{ display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }
    a.btn{
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      padding:.65rem .95rem;
      border-radius:12px;
      text-decoration:none;
      border:1px solid var(--border);
      color:var(--text);
      background:rgba(15,23,42,.65);
    }
    a.btn.primary{
      background:linear-gradient(180deg, rgba(251,113,133,.28), rgba(251,113,133,.12));
      border-color:rgba(251,113,133,.35);
    }
    .hint{
      margin-top:14px;
      font-size:.9rem;
      color:var(--muted);
      border-top:1px solid var(--border);
      padding-top:14px;
      word-break:break-word;
    }
    code{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      background:rgba(0,0,0,.25);
      padding:.15rem .35rem;
      border-radius:8px;
      border:1px solid var(--border);
    }
  </style>
</head>
<body>
<main class="card">
  <div class="pill">401 • Unauthorized</div>
  <h1>Authentication required</h1>
  <p>
    You must sign in (or provide valid credentials) to access this resource.
  </p>

  <div class="actions">
    <a class="btn primary" href="/">Go to homepage</a>
    <a class="btn" href="javascript:history.back()">Go back</a>
  </div>

  <div class="hint">
    Requested path: <code id="path"></code>
  </div>
</main>

<script>
  document.getElementById('path').textContent = location.pathname;
</script>
</body>
</html>
