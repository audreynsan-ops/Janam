worker_processes 1;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # (https://t37.net/optimisations-nginx-bien-comprendre-sendfile-tcp-nodelay-et-tcp-nopush.html)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    gzip on;
    gzip_disable "msie6";

    server_tokens off;

    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    client_max_body_size 32M;
    client_body_buffer_size 32M;

    server {
        listen 8000;
        server_name default;

        root /app/web;

        # Leave the application serve some 40x error pages instead of the static
        # ones provided by Nginx. This allows to display the login form on 403
        # responses for example.
        # Uncomment some of the lines below to use the static pages in order
        # to save performances, but resulting in non-customized pages.
        #error_page 401 =401 /static-error-pages/401.html;
        #error_page 403 =403 /static-error-pages/403.html;
        #error_page 404 =404 /static-error-pages/404.html;

        error_page 500 =500 /static-error-pages/500.html;
        error_page 502 =502 /static-error-pages/502.html;
        error_page 503 =503 /static-error-pages/503.html;
        error_page 504 =504 /static-error-pages/504.html;

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }

        # Very rarely should these ever be accessed outside of your lan
        location ~* \.(txt|log)$ {
            allow 127.0.0.1;
            deny all;
        }

        # No HTTP access to private files
        location ~ ^/sites/.*/private {
            return 403;
        }

        # Block access to scripts in site files directory
        location ~ ^/sites/[^/]+/files/.*\.php$ {
            deny all;
        }

        # Allow "Well-Known URIs" as per RFC 5785
        location ~* ^/.well-known/ {
            allow all;
        }

        # Block access to "hidden" files and directories whose names begin with
        # a period. This includes directories used by version control systems
        # such as Subversion or Git to store control files.
        location ~ (^|/)\. {
            return 403;
        }

        # Search engines musn't index pdf and doc/docx
        location ~* \.(doc|docx|pdf)$ {
            add_header X-Robots-Tag "noindex, nofollow";
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        # XML Sitemap support.
        location = /sitemap.xml {
            try_files $uri @app;
        }

        location @app {
            index index.php;
            rewrite ^ /index.php;
        }

        # The above REGEX is split into several blocks.
        #
        # Protect files and directories from prying eyes.
        #location ~ \.(?:htaccess|engine|inc|log|info|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml|yaml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|\/(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config|yarn\.lock|package\.json|example\.nginx)$|\/#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
        #    deny all;
        #    return 404;
        #}

        # Deny "example.nginx". This needs to be adapted if the application root
        # is in a subfolder.
        location = /example.nginx {
            deny all;
            return 404;
        }

        # Deny "web.config". This needs to be adapted if the application root is
        # in a subfolder.
        location = /web.config {
            deny all;
        }

        # Don't allow direct access to PHP files in the vendor directory.
        location ~ /vendor/.*\.php$ {
            deny all;
            return 404;
        }

        # Deny hidden files/dirs anywhere (except .well-known)
        location ~ ^/(?:.*/)?\.(?!well-known/).+ {
            deny all;
            return 404;
        }

        # Deny VCS metadata directories anywhere
        location ~ ^/(?:.*/)?(?:CVS|\.svn|\.git|\.hg)(?:/|$) {
            deny all;
            return 404;
        }

        # Deny SVN/CVS special files (Entries, Repository, Root, Tag, Template) anywhere
        location ~ ^/(?:.*/)?(?:Entries(?:\..*)?|Repository|Root|Tag|Template)$ {
            deny all;
            return 404;
        }

        # Deny dependency/manifest/config files anywhere (your requirement)
        location ~ ^/(?:.*/)?(?:composer\.(?:json|lock)|yarn\.lock|package\.json|web\.config)$ {
            deny all;
            return 404;
        }

        # Deny editor backup/swap files anywhere (covers .swp/.swo, .bak, etc.)
        location ~ ^/(?:.*/)?.+\.(?:sw[op]|bak|orig|save) {
            deny all;
            return 404;
        }

        # Deny anypath that ends with a literal ~.
        location ~ ^/(?:.*/)?.+~$ {
            deny all;
            return 404;
        }

        # Deny source/config/script-like extensions anywhere (tightened & anchored)
        location ~ ^/(?:.*/)?.+\.(?:htaccess|engine|inc|log|info|install|make|module|profile|po|sh|theme|twig|tpl|xtmpl|yml|yaml|sql)$ {
            deny all;
            return 404;
        }

        # In Drupal 8, we must also match new paths where the '.php' appears in the
        # middle, such as update.php/selection. The rule we use is strict, and only
        # allows this pattern with the update.php front controller.  This allows
        # legacy path aliases in the form of blog/index.php/legacy-path to continue
        # to route to Drupal nodes. If you do not have any paths like that, then
        # you might prefer to use a laxer rule, such as:
        #   location ~ \.php(/|$) {
        # The laxer rule will continue to work if Drupal uses this new URL pattern
        # with front controllers other than update.php in a future release.
        # As we do not use the update.php script for safety, and rely on server
        # scripts for the update, we use a more restrictive rule. The original one
        # is the following:
        #   location ~ '\.php$|^/update.php' {
        # Allow only a few php files to improve security.
        # For "cron" or "update" tasks use drupal console instead.
        location ~* ^/(${NGINX_ALLOWED_PHP_FILES})\.php$ {
            # Hide "X-Powered-By" header
            fastcgi_hide_header X-Powered-By;
            fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
            # Security note: If you're running a version of PHP older than the
            # latest 5.3, you should have "cgi.fix_pathinfo = 0;" in php.ini.
            # See http://serverfault.com/q/627903/94922 for details.
            include fastcgi_params;
            # Block httpoxy attacks. See https://httpoxy.org/.
            fastcgi_param HTTP_PROXY "";
            #fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_intercept_errors on;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            # Force HTTPS when the application is behind a reverse proxy.
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_SCHEME https;
            fastcgi_param HTTP_X_FORWARDED_PORT 443;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_pass ${FASTCGI_URL}:${FASTCGI_PORT};
            ${FASTCGI_EXTRA_DIRECTIVES}
        }

        location ~* ^.+\.php$ {
            deny all;
            return 404;
        }

        # Passes image style and asset generation to PHP.
        location ~ ^/sites/.*/files/(css|js|styles)/ {
            access_log off;
            try_files $uri @app;
        }

        # Handle private files through Drupal. Private file's path can come
        # with a language prefix.
        location ~ ^(/[a-z\-]+)?/system/files/ {
            access_log off;
            # Prevent nginx from timing out while PHP streams large files.
            fastcgi_read_timeout 600s;
            send_timeout 600s;
            # Avoid buffering large PHP responses to disk/memory.
            fastcgi_buffering off;
            fastcgi_max_temp_file_size 0;
            try_files $uri @app;
        }

        # Implements the “authorize in Drupal, serve bytes in nginx” pattern.
        #
        # Improve the way Drupal handles private downloads. Instead of using
        # PHP-FPM to serve those files, just rely on Drupal for the
        # authorization decision, but stream the file through Nginx (reduced PHP
        # memory/time).
        location ^~ /_drupal_private_files/ {
            internal;
            # Map internal URI to the real filesystem path holding private
            # files. Adjust if the private folder is somewhere else.
            alias /app/private/;
            # Optional: good defaults for big downloads
            sendfile on;
            tcp_nopush on;
            # Optional: let clients resume downloads
            aio threads;
        }

        # All static files will be served directly.
        location ~* \.(?:css|cur|js|map|jpe?g|gif|htc|ico|png|otf|ttf|eot|woff2?|svg|webp|avif)$ {
            access_log off;
            log_not_found off;
            expires 30d;
            # No need to bleed constant updates. Send the all shebang in one
            # fell swoop.
            tcp_nodelay off;
            # Set the OS file cache.
            open_file_cache max=3000 inactive=120s;
            open_file_cache_valid 45s;
            open_file_cache_min_uses 2;
            open_file_cache_errors off;
            # If the media doesn't exist, serve a static 404 page, instead of
            # spending Drupal resources.
            error_page 404 =404 /static-error-pages/404.html;
            # If Drupal may generate dynamic files and none of the already
            # defined blocks handle the use case, use the two following lines
            # instead of the above ones.
            # If the media doesn't exists fallback to drupal.
            #error_page 404 = @app;
        }

        location ^~ /static-error-pages/ {
            internal;
            # Serve the file from disk.
            root /app;
            default_type text/html;
            add_header Cache-Control "no-store";
            expires -1;
        }
    }
}
